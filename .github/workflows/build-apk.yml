name: Build Android APK from HTML

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Single HTML File and Capacitor
        run: |
          mkdir -p web_dist

          # Find your .html file automatically, whatever it is named
          HTML_FILE=$(find . -maxdepth 2 -name "*.html" ! -path "*/.*" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No .html file found in your repository!"
            exit 1
          fi

          echo "Found your HTML file: $HTML_FILE"
          cp "$HTML_FILE" web_dist/index.html

          # Initialize and package
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "My App" "com.singlehtml.app" --web-dir web_dist
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: '**/*.apk'
          if-no-files-found: error￼Enter
