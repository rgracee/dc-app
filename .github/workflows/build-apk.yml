name: Build Android APK from HTML

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Scaffold App with Capacitor
        run: |
          mkdir -p web_dist

          # Find your HTML file
          HTML_FILE=$(find . -maxdepth 2 -name "*.html" ! -path "*/.*" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No .html file found!"
            exit 1
          fi
          echo "Using HTML: $HTML_FILE"
          cp "$HTML_FILE" web_dist/index.html

          # Initialize Capacitor
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/splash-screen@^6.0.0

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.dc.app",
            "appName": "Daily Communication",
            "webDir": "web_dist",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#ffffff",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              }
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Apply Custom Icons and Splash (Android 10 Compatible)
        run: |
          python3 - << 'EOF'
          import os, sys, shutil
          from PIL import Image

          # 1. Target icon.jpg directly from root
          image_candidates = [f for f in os.listdir('.') if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp'))]
          if not image_candidates:
              print("ERROR: No image file found in root!")
              sys.exit(1)

          found_image = image_candidates[0]
          print(f"SUCCESS: Using custom image -> {found_image}")
          im = Image.open(found_image).convert("RGBA")

          # 2. Delete Android adaptive vector folders that cause the default blue logo
          shutil.rmtree("android/app/src/main/res/mipmap-anydpi-v26", ignore_errors=True)

          # Delete leftover foreground vector XMLs
          for root, dirs, files in os.walk("android/app/src/main/res"):
              for f in files:
                  if "ic_launcher_foreground" in f and f.endswith(".xml"):
                      os.remove(os.path.join(root, f))

          # 3. Generate launcher icons for all Android densities
          densities = {
              'mdpi': (48, 108),
              'hdpi': (72, 162),
              'xhdpi': (96, 216),
              'xxhdpi': (144, 324),
              'xxxhdpi': (192, 432),
          }

          for density, (icon_size, fg_size) in densities.items():
              res_dir = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(res_dir, exist_ok=True)
              im.resize((icon_size, icon_size), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher.png")
              im.resize((icon_size, icon_size), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher_round.png")
              im.resize((fg_size, fg_size), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher_foreground.png")

          # 4. Replace splash screen in all drawable folders
          for root, dirs, files in os.walk("android/app/src/main/res"):
              if "drawable" in os.path.basename(root):
                  im.save(os.path.join(root, "splash.png"))
                  im.resize((432, 432), Image.Resampling.LANCZOS).save(os.path.join(root, "ic_launcher_foreground.png"))

          # 5. Fix Android 10 styles.xml to display your image full-screen
          styles_path = "android/app/src/main/res/values/styles.xml"
          if os.path.exists(styles_path):
              with open(styles_path, 'r') as f:
                  style_content = f.read()

              style_content = style_content.replace('parent="Theme.SplashScreen"', 'parent="AppTheme.NoActionBar"')
              style_content = style_content.replace('@drawable/ic_launcher_foreground', '@drawable/splash')

              with open(styles_path, 'w') as f:
                  f.write(style_content)
              print("Updated styles.xml for Android 10 compatibility.")

          print("All custom assets applied successfully!")
          EOF

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: '**/*.apk'
